<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entity</title>

    <!-- Google Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..600,0..1,-50..200&display=swap"
        rel="stylesheet"
    >

    <!-- Entity CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

<div class="app-shell">

    <!-- =========================
         LEFT SIDEBAR
    ========================== -->
    <aside class="sidebar">

        <!-- BRAND -->
        <div class="brand">
            <div class="brand-title">Entity</div>
        </div>

        <!-- MAIN NAVIGATION -->
        <nav class="main-nav">

            <button class="nav-item active" type="button">
                <span class="material-symbols-rounded nav-icon">
                    add
                </span>
                <span>New</span>
            </button>

            <button class="nav-item" type="button">
                <span class="material-symbols-rounded nav-icon">
                    folder_open
                </span>
                <span>Projects</span>
            </button>

            <button class="nav-item" type="button">
                <span class="material-symbols-rounded nav-icon">
                    account_tree
                </span>
                <span>Artifacts</span>
            </button>

            <button class="nav-item" type="button">
                <span class="material-symbols-rounded nav-icon">
                    code
                </span>

                <span>Code</span>

                <span class="upgrade-mini">
                    Upgrade
                </span>
            </button>

            <button class="nav-item" type="button">
                <span class="material-symbols-rounded nav-icon">
                    tune
                </span>
                <span>Customize</span>
            </button>

        </nav>

        <!-- CHATS -->
        <div class="chats-heading">

            <div class="chats-title">
                <span>Chats and tasks</span>

                <span class="material-symbols-rounded heading-arrow">
                    chevron_right
                </span>
            </div>

            <button
                class="filter-btn"
                type="button"
                aria-label="Filter"
            >
                <span class="material-symbols-rounded">
                    tune
                </span>
            </button>

        </div>

        <!-- EMPTY SPACE -->
        <div class="sidebar-spacer"></div>

        <!-- DESIGN -->
        <button class="design-row" type="button">

            <span class="material-symbols-rounded design-icon">
                palette
            </span>

            <span>Design</span>

        </button>

        <!-- ACCOUNT MENU -->
        <div class="account-menu-wrap">

            <button
                class="account-row"
                id="accountButton"
                type="button"
                aria-label="Account menu"
                aria-expanded="false"
            >

                <span class="avatar">
                    DS
                </span>

                <span class="account-text">

                    <strong>
                        Dhruv Singh
                    </strong>

                    <small>
                        Free
                    </small>

                </span>

                <span class="material-symbols-rounded account-arrow">
                    expand_more
                </span>

            </button>


            <!-- ACCOUNT DROPDOWN -->
            <div
                class="account-menu"
                id="accountMenu"
                aria-hidden="true"
            >

                <div class="account-email">
                    Your account
                </div>


                <button
                    class="account-menu-item"
                    id="settingsMenuButton"
                    type="button"
                >
                    <span class="material-symbols-rounded">
                        settings
                    </span>

                    <span>
                        Settings
                    </span>

                    <span class="account-shortcut">
                        Ctrl ⇧ ,
                    </span>
                </button>


                <button
                    class="account-menu-item"
                    id="languageMenuButton"
                    type="button"
                >
                    <span class="material-symbols-rounded">
                        language
                    </span>

                    <span>
                        Language
                    </span>
                </button>


                <button
                    class="account-menu-item"
                    id="helpMenuButton"
                    type="button"
                >
                    <span class="material-symbols-rounded">
                        help
                    </span>

                    <span>
                        Get help
                    </span>
                </button>


                <div class="account-menu-divider"></div>


                <button
                    class="account-menu-item"
                    id="upgradeMenuButton"
                    type="button"
                >
                    <span class="material-symbols-rounded">
                        arrow_upward
                    </span>

                    <span>
                        Upgrade plan
                    </span>
                </button>


                <button
                    class="account-menu-item"
                    id="appsMenuButton"
                    type="button"
                >
                    <span class="material-symbols-rounded">
                        download
                    </span>

                    <span>
                        Get apps and extensions
                    </span>
                </button>


                <button
                    class="account-menu-item"
                    id="academyMenuButton"
                    type="button"
                >
                    <span class="material-symbols-rounded">
                        school
                    </span>

                    <span>
                        Entity Academy
                    </span>

                    <span class="account-new-badge">
                        New
                    </span>
                </button>


                <button
                    class="account-menu-item"
                    id="learnMoreMenuButton"
                    type="button"
                >
                    <span class="material-symbols-rounded">
                        info
                    </span>

                    <span>
                        Learn more
                    </span>

                    <span class="material-symbols-rounded account-item-arrow">
                        chevron_right
                    </span>
                </button>


                <div class="account-menu-divider"></div>


                <button
                    class="account-menu-item logout-item"
                    id="logoutMenuButton"
                    type="button"
                >
                    <span class="material-symbols-rounded">
                        logout
                    </span>

                    <span>
                        Log out
                    </span>
                </button>

            </div>

        </div>

    </aside>


    <!-- =========================
         MAIN CONTENT
    ========================== -->
    <main class="main">

        <!-- TOP PLAN -->
        <div class="plan-pill">

            <span>
                Free plan
            </span>

            <span class="dot">
                ·
            </span>

            <button type="button">
                Upgrade
            </button>

        </div>


        <!-- TOP RIGHT HELP -->
        <button
            class="top-icon"
            type="button"
            aria-label="Help"
        >
            <span class="material-symbols-rounded">
                support_agent
            </span>
        </button>


        <!-- HOME -->
        <section class="home">

            <!-- GREETING -->
            <h1 class="greeting">

                <span class="material-symbols-rounded entity-mark">
                    auto_awesome
                </span>

                <span
    class="greeting-text"
    id="greetingText"
>
    Good evening, Dhruv Singh
</span>

            </h1>


            <!-- =========================
                 CHAT COMPOSER
            ========================== -->
            <div class="composer">

                <textarea
                    id="messageInput"
                    rows="1"
                    placeholder="How can I help you today?"
                    aria-label="Message"
                ></textarea>


                <!-- COMPOSER TOOLBAR -->
                <div class="composer-toolbar">

                    <!-- LEFT -->
                    <div class="toolbar-left">

                        <!-- PLUS -->
                        <button
                            class="icon-btn add-btn"
                            type="button"
                            aria-label="Add"
                        >
                            <span class="material-symbols-rounded">
                                add
                            </span>
                        </button>


                        <!-- CHAT / COWORK -->
                        <div class="mode-switch">

                            <button
                                class="mode active"
                                type="button"
                            >
                                Chat
                            </button>

                            <button
                                class="mode"
                                type="button"
                            >
                                Cowork
                            </button>

                        </div>

                    </div>


                    <!-- RIGHT -->
                    <div class="toolbar-right">

                        <!-- MODEL -->
                        <button
                            class="model-btn"
                            id="modelButton"
                            type="button"
                        >

                            <strong>
                                Entity Pulse
                            </strong>

                            <span>
                                Medium
                            </span>

                            <span class="material-symbols-rounded model-chevron">
                                expand_more
                            </span>

                        </button>


                        <!-- MICROPHONE -->
                        <button
                            class="icon-btn mic-btn"
                            type="button"
                            aria-label="Voice"
                        >

                            <span class="material-symbols-rounded">
                                mic
                            </span>

                        </button>


                        <!-- VOICE MODE -->
                        <button
                            class="icon-btn wave-btn"
                            type="button"
                            aria-label="Voice mode"
                        >

                            <span class="material-symbols-rounded">
                                graphic_eq
                            </span>

                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

</div>


<script>
/* =========================================================
   ENTITY HOME -> CHAT PAGE
========================================================= */

(function () {

    const input =
        document.getElementById("messageInput");

    if (!input) {
        console.warn(
            "Entity: messageInput not found."
        );
        return;
    }


    function openChatPage() {

        const message =
            input.value.trim();


        if (!message) {
            return;
        }


        /*
         * Save currently selected model
         * and effort before leaving home.
         */

        const modelButton =
            document.getElementById(
                "modelButton"
            );


        if (modelButton) {

            const strong =
                modelButton.querySelector(
                    "strong"
                );

            const spans =
                modelButton.querySelectorAll(
                    ":scope > span"
                );


            if (strong) {

                localStorage.setItem(
                    "entity_ollama_model",
                    strong.textContent.trim()
                );

            }


            /*
             * Existing model button has:
             *
             * strong = model name
             * span   = effort
             * span   = arrow
             */

            if (spans.length > 0) {

                const effort =
                    spans[0].textContent.trim();


                if (effort) {

                    localStorage.setItem(
                        "entity_effort",
                        effort
                    );

                }

            }

        }


        /*
         * Send message to index2.html.
         */

        const url =
            "/chat?message=" +
            encodeURIComponent(message);


        window.location.href =
            url;

    }


    /* =====================================================
       ENTER TO OPEN CHAT
    ===================================================== */

    input.addEventListener(
        "keydown",
        function (event) {

            /*
             * Enter = send
             * Shift + Enter = new line
             */

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                openChatPage();

            }

        }
    );


    console.log(
        "Entity home -> chat navigation ready."
    );

})();
</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
