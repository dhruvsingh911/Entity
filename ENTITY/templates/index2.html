<!-- =========================================================
     CHAT JAVASCRIPT
========================================================= -->

<script>

(function () {

    const messages =
        document.getElementById("messages");

    const input =
        document.getElementById("chatInput");

    const sendButton =
        document.getElementById("sendButton");

    const title =
        document.getElementById("chatTitleText");

    const modelName =
        document.getElementById("chatModelName");

    const effortName =
        document.getElementById("chatEffort");


    let selectedModel =
        localStorage.getItem(
            "entity_ollama_model"
        ) || "qwen3:4b";


    let selectedEffort =
        localStorage.getItem(
            "entity_effort"
        ) || "Medium";


    modelName.textContent =
        selectedModel;

    effortName.textContent =
        selectedEffort;


    /* =====================================================
       HELPERS
    ===================================================== */

    function scrollBottom() {

        requestAnimationFrame(() => {

            messages.scrollTop =
                messages.scrollHeight;

        });

    }


    function addUserMessage(text) {

        const row =
            document.createElement("div");

        row.className =
            "user-row";


        const bubble =
            document.createElement("div");

        bubble.className =
            "user-message";

        bubble.textContent =
            text;


        row.appendChild(bubble);

        messages.appendChild(row);

        scrollBottom();

    }


    function createAssistantMessage() {

        const row =
            document.createElement("div");

        row.className =
            "assistant-row";


        const icon =
            document.createElement("div");

        icon.className =
            "assistant-icon";


        icon.innerHTML = `
            <span class="material-symbols-rounded">
                auto_awesome
            </span>
        `;


        const content =
            document.createElement("div");

        content.className =
            "assistant-content";


        row.appendChild(icon);

        row.appendChild(content);

        messages.appendChild(row);

        scrollBottom();


        return content;

    }


    function showThinking(content) {

        content.innerHTML = `
            <div class="thinking">
                <span></span>
                <span></span>
                <span></span>
            </div>
        `;

    }


    /* =====================================================
       OLLAMA REQUEST
    ===================================================== */

    async function askEntity(text) {

        const content =
            createAssistantMessage();

        showThinking(content);


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            model:
                                selectedModel,

                            message:
                                text,

                            effort:
                                selectedEffort

                        })
                    }
                );


            if (!response.ok) {

                throw new Error(
                    await response.text()
                );

            }


            /*
             * Supports streaming responses.
             */

            if (response.body) {

                const reader =
                    response.body.getReader();

                const decoder =
                    new TextDecoder();

                let answer = "";

                content.textContent = "";


                while (true) {

                    const result =
                        await reader.read();

                    if (result.done) {
                        break;
                    }


                    const chunk =
                        decoder.decode(
                            result.value,
                            {
                                stream: true
                            }
                        );


                    answer += chunk;

                    content.textContent =
                        answer;

                    scrollBottom();

                }


                const remaining =
                    decoder.decode();


                if (remaining) {

                    answer += remaining;

                    content.textContent =
                        answer;

                }


            } else {

                const data =
                    await response.json();

                content.textContent =
                    data.response ||
                    data.message ||
                    data.reply ||
                    "";

            }


            if (!content.textContent.trim()) {

                content.textContent =
                    "Entity received an empty response.";

            }


        } catch (error) {

            console.error(
                "Entity Ollama error:",
                error
            );


            content.textContent =
                "I couldn't connect to the Entity AI server. Please make sure Ollama and Flask are running.";

        }


        scrollBottom();

    }


    /* =====================================================
       SEND
    ===================================================== */

    async function sendMessage() {

        const text =
            input.value.trim();


        if (!text) {
            return;
        }


        input.value = "";

        input.style.height =
            "auto";


        addUserMessage(text);


        /*
         * First message becomes
         * conversation title.
         */

        if (
            title.textContent ===
            "New conversation"
        ) {

            title.textContent =
                text.length > 35
                    ? text.substring(0, 35) + "..."
                    : text;

        }


        sendButton.disabled =
            true;


        await askEntity(text);


        sendButton.disabled =
            false;


        input.focus();

    }


    /* =====================================================
       BUTTON
    ===================================================== */

    sendButton.addEventListener(
        "click",
        sendMessage
    );


    /* =====================================================
       ENTER
    ===================================================== */

    input.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


    /* =====================================================
       AUTO RESIZE
    ===================================================== */

    input.addEventListener(
        "input",
        function () {

            input.style.height =
                "auto";


            input.style.height =
                Math.min(
                    input.scrollHeight,
                    130
                ) + "px";

        }
    );


    /* =====================================================
       MODE BUTTONS
    ===================================================== */

    document
        .querySelectorAll(".chat-mode button")
        .forEach(button => {

            button.addEventListener(
                "click",
                function () {

                    document
                        .querySelectorAll(
                            ".chat-mode button"
                        )
                        .forEach(
                            item =>
                                item.classList.remove(
                                    "active"
                                )
                        );


                    button.classList.add(
                        "active"
                    );

                }
            );

        });


    /* =====================================================
       FIRST MESSAGE FROM INDEX.HTML
    ===================================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const firstMessage =
        params.get("message");


    if (firstMessage) {

        /*
         * Put message into chat
         * automatically.
         */

        title.textContent =
            firstMessage.length > 35
                ? firstMessage.substring(0, 35) + "..."
                : firstMessage;


        addUserMessage(
            firstMessage
        );


        /*
         * Automatically send to Ollama.
         */

        askEntity(
            firstMessage
        );

    }


    /*
     * Focus composer after page loads.
     */

    setTimeout(
        () => input.focus(),
        200
    );



    /* =====================================================
       PLUS MENU
    ===================================================== */

    const addButton =
        document.getElementById("chatAddButton");

    const addMenu =
        document.getElementById("chatAddMenu");


    function positionAddMenu() {

        if (!addButton || !addMenu) {
            return;
        }

        /*
         * CSS anchors the menu to .toolbar-left.
         * Remove old viewport coordinates from earlier versions.
         */

        addMenu.style.left = "";
        addMenu.style.right = "";
        addMenu.style.top = "";
        addMenu.style.bottom = "";
    }


    if (addButton && addMenu) {

        addButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                /*
                 * Close model menu first.
                 */

                if (modelMenu) {
                    modelMenu.classList.remove("open");
                }

                positionAddMenu();

                addMenu.classList.toggle("open");
            }
        );

        addMenu.addEventListener(
            "click",
            function (event) {
                event.stopPropagation();
            }
        );
    }


    /* =====================================================
       MODEL MENU
    ===================================================== */

    const modelButton =
        document.getElementById("chatModelButton");

    const modelMenu =
        document.getElementById("chatModelMenu");

    const modelPanel =
        document.getElementById("chatModelPanel");

    const effortPanel =
        document.getElementById("chatEffortPanel");

    const effortOpenButton =
        document.getElementById("effortOpenButton");

    const effortBackButton =
        document.getElementById("effortBackButton");

    const effortPreview =
        document.getElementById("effortPreview");


    function positionModelMenu() {

        if (!modelButton || !modelMenu) {
            return;
        }

        /*
         * CSS anchors the menu to .toolbar-right.
         * Remove old viewport coordinates from earlier versions.
         */

        modelMenu.style.left = "";
        modelMenu.style.right = "";
        modelMenu.style.top = "";
        modelMenu.style.bottom = "";
    }


    function updateModelChecks() {

        document
            .querySelectorAll(
                ".chat-model-option"
            )
            .forEach(option => {

                const selected =
                    option.dataset.model ===
                    selectedModel;

                option.classList.toggle(
                    "selected",
                    selected
                );

                const check =
                    option.querySelector(".check");

                if (check) {
                    check.style.visibility =
                        selected
                            ? "visible"
                            : "hidden";
                }
            });
    }


    function updateEffortChecks() {

        document
            .querySelectorAll(
                ".chat-effort-option"
            )
            .forEach(option => {

                const selected =
                    option.dataset.effort ===
                    selectedEffort;

                option.classList.toggle(
                    "selected",
                    selected
                );

                const check =
                    option.querySelector(".check");

                if (check) {
                    check.style.visibility =
                        selected
                            ? "visible"
                            : "hidden";
                }
            });

        if (effortPreview) {
            effortPreview.textContent =
                selectedEffort;
        }

        effortName.textContent =
            selectedEffort;
    }


    if (modelButton && modelMenu) {

        modelButton.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();

                /*
                 * Close plus menu.
                 */

                if (addMenu) {
                    addMenu.classList.remove("open");
                }

                positionModelMenu();

                modelMenu.classList.toggle("open");

                if (modelMenu.classList.contains("open")) {
                    updateModelChecks();
                    updateEffortChecks();
                }
            }
        );


        modelMenu.addEventListener(
            "click",
            function (event) {
                event.stopPropagation();
            }
        );
    }


    /* =====================================================
       SELECT OLLAMA MODEL
    ===================================================== */

    document
        .querySelectorAll(
            ".chat-model-option"
        )
        .forEach(option => {

            option.addEventListener(
                "click",
                function () {

                    selectedModel =
                        option.dataset.model;

                    localStorage.setItem(
                        "entity_ollama_model",
                        selectedModel
                    );

                    modelName.textContent =
                        selectedModel;

                    updateModelChecks();

                    /*
                     * Keep menu open so user can
                     * immediately choose effort.
                     */

                }
            );

        });


    /* =====================================================
       EFFORT MENU
    ===================================================== */

    if (effortOpenButton) {

        effortOpenButton.addEventListener(
            "click",
            function () {

                modelPanel.classList.add(
                    "hidden"
                );

                effortPanel.classList.add(
                    "open"
                );

                updateEffortChecks();
            }
        );

    }


    if (effortBackButton) {

        effortBackButton.addEventListener(
            "click",
            function () {

                effortPanel.classList.remove(
                    "open"
                );

                modelPanel.classList.remove(
                    "hidden"
                );
            }
        );

    }


    document
        .querySelectorAll(
            ".chat-effort-option"
        )
        .forEach(option => {

            option.addEventListener(
                "click",
                function () {

                    selectedEffort =
                        option.dataset.effort;

                    localStorage.setItem(
                        "entity_effort",
                        selectedEffort
                    );

                    effortName.textContent =
                        selectedEffort;

                    updateEffortChecks();

                    /*
                     * Return to model panel.
                     */

                    effortPanel.classList.remove(
                        "open"
                    );

                    modelPanel.classList.remove(
                        "hidden"
                    );

                }
            );

        });


    /* =====================================================
       CLOSE MENUS
    ===================================================== */

    document.addEventListener(
        "click",
        function () {

            if (addMenu) {
                addMenu.classList.remove("open");
            }

            if (modelMenu) {
                modelMenu.classList.remove("open");
            }

            if (effortPanel) {
                effortPanel.classList.remove("open");
            }

            if (modelPanel) {
                modelPanel.classList.remove("hidden");
            }

        }
    );


    window.addEventListener(
        "resize",
        function () {

            if (
                addMenu &&
                addMenu.classList.contains("open")
            ) {
                positionAddMenu();
            }

            if (
                modelMenu &&
                modelMenu.classList.contains("open")
            ) {
                positionModelMenu();
            }

        }
    );


    /*
     * Initial state.
     */

    updateModelChecks();
    updateEffortChecks();

    console.log(
        "Entity index2 chat ready."
    );

})();

</script>


<script>
/* =========================================================
   ENTITY CHAT HISTORY + COPY + REGENERATE + CODE FORMAT
========================================================= */
(function () {

    const HISTORY_KEY = "entity_chat_history_v1";
    const CURRENT_KEY = "entity_current_chat_id";

    const messagesEl = document.getElementById("messages");
    const titleEl = document.getElementById("chatTitleText");
    const modelEl = document.getElementById("chatModelName");
    const effortEl = document.getElementById("chatEffort");

    if (!messagesEl) return;

    let history = loadHistory();
    let currentId = localStorage.getItem(CURRENT_KEY);
    const requestedChatId = new URLSearchParams(window.location.search).get("chat_id");
    if (requestedChatId) currentId = requestedChatId;
    let currentChat = null;

    function loadHistory() {
        try {
            const data = JSON.parse(
                localStorage.getItem(HISTORY_KEY) || "[]"
            );
            return Array.isArray(data) ? data : [];
        } catch (error) {
            console.warn("Entity history load failed:", error);
            return [];
        }
    }

    function saveHistory() {
        localStorage.setItem(
            HISTORY_KEY,
            JSON.stringify(history)
        );
    }

    function makeId() {
        return "chat_" + Date.now() + "_" +
            Math.random().toString(36).slice(2, 8);
    }

    function shortTitle(text) {
        const clean = String(text || "").trim();
        return clean.length > 32
            ? clean.slice(0, 32) + "..."
            : clean || "New conversation";
    }

    function getOrCreateChat() {
        if (currentId) {
            const found = history.find(item => item.id === currentId);
            if (found) return found;
        }

        const chat = {
            id: makeId(),
            title: "New conversation",
            messages: [],
            model: localStorage.getItem("entity_ollama_model") || "qwen3:4b",
            effort: localStorage.getItem("entity_effort") || "Medium",
            createdAt: Date.now(),
            updatedAt: Date.now()
        };

        history.unshift(chat);
        currentId = chat.id;
        localStorage.setItem(CURRENT_KEY, currentId);
        saveHistory();
        return chat;
    }

    currentChat = getOrCreateChat();

    /* =====================================================
       SIDEBAR HISTORY
    ===================================================== */

    function buildHistoryUI() {
        const heading = document.querySelector(
            ".entity-chat-sidebar .chats-heading"
        );

        if (!heading) return null;

        let list = document.getElementById("chatHistoryList");
        if (list) return list;

        list = document.createElement("div");
        list.id = "chatHistoryList";
        list.className = "chat-history-list";
        heading.insertAdjacentElement("afterend", list);
        return list;
    }

    function renderHistoryUI() {
        const list = buildHistoryUI();
        if (!list) return;

        list.innerHTML = "";

        history
            .slice()
            .sort((a, b) => b.updatedAt - a.updatedAt)
            .forEach(chat => {
                if (!chat.messages.length && chat.id !== currentId) return;

                const row = document.createElement("div");
                row.className = "chat-history-item" +
                    (chat.id === currentId ? " active" : "");

                const open = document.createElement("button");
                open.className = "chat-history-open";
                open.type = "button";
                open.title = chat.title;
                open.textContent = chat.title;

                const del = document.createElement("button");
                del.className = "chat-history-delete";
                del.type = "button";
                del.title = "Delete chat";
                del.innerHTML = '<span class="material-symbols-rounded">delete</span>';

                open.addEventListener("click", () => {
                    localStorage.setItem(CURRENT_KEY, chat.id);
                    window.location.href = "/chat?chat_id=" +
                        encodeURIComponent(chat.id);
                });

                del.addEventListener("click", event => {
                    event.stopPropagation();
                    deleteChat(chat.id);
                });

                row.append(open, del);
                list.appendChild(row);
            });
    }

    function deleteChat(id) {
        history = history.filter(item => item.id !== id);
        saveHistory();

        if (id === currentId) {
            const next = history[0];

            if (next) {
                currentId = next.id;
                localStorage.setItem(CURRENT_KEY, currentId);
                window.location.href = "/chat?chat_id=" +
                    encodeURIComponent(currentId);
                return;
            }

            localStorage.removeItem(CURRENT_KEY);
            window.location.href = "/";
            return;
        }

        renderHistoryUI();
    }

    renderHistoryUI();

    /* =====================================================
       CHAT ACTIONS
    ===================================================== */

    const topbar = document.querySelector(".chat-topbar");
    const shareButton = document.querySelector(".share-button");

    if (topbar && shareButton && !document.getElementById("chatActions")) {
        const actions = document.createElement("div");
        actions.id = "chatActions";
        actions.className = "chat-actions";

        const copyAll = document.createElement("button");
        copyAll.className = "chat-action-button";
        copyAll.type = "button";
        copyAll.title = "Copy chat";
        copyAll.innerHTML = '<span class="material-symbols-rounded">content_copy</span>';

        const deleteCurrent = document.createElement("button");
        deleteCurrent.className = "chat-action-button danger";
        deleteCurrent.type = "button";
        deleteCurrent.title = "Delete chat";
        deleteCurrent.innerHTML = '<span class="material-symbols-rounded">delete</span>';

        copyAll.addEventListener("click", async () => {
            const text = getChatPlainText();
            if (!text) return;
            await copyText(text);
            flashButton(copyAll, "check");
        });

        deleteCurrent.addEventListener("click", () => {
            if (confirm("Delete this chat?")) {
                deleteChat(currentId);
            }
        });

        actions.append(copyAll, deleteCurrent);
        topbar.insertBefore(actions, shareButton);
    }

    function getChatPlainText() {
        return Array.from(messagesEl.children)
            .map(row => {
                const user = row.querySelector(".user-message");
                const assistant = row.querySelector(".assistant-content");

                if (user) return "You:\n" + user.textContent.trim();
                if (assistant) {
                    return "Entity:\n" +
                        (assistant.dataset.rawText || assistant.textContent).trim();
                }
                return "";
            })
            .filter(Boolean)
            .join("\n\n");
    }

    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(text);
        } catch (error) {
            const area = document.createElement("textarea");
            area.value = text;
            area.style.position = "fixed";
            area.style.opacity = "0";
            document.body.appendChild(area);
            area.select();
            document.execCommand("copy");
            area.remove();
        }
    }

    function flashButton(button, icon) {
        const old = button.innerHTML;
        button.innerHTML =
            '<span class="material-symbols-rounded">' + icon + '</span>';
        setTimeout(() => button.innerHTML = old, 1000);
    }

    /* =====================================================
       MARKDOWN / PYTHON CODE FORMATTER
    ===================================================== */

    function escapeHtml(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function renderAssistantText(raw) {
        const text = String(raw || "");
        const fence = /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g;
        let html = "";
        let last = 0;
        let match;

        while ((match = fence.exec(text)) !== null) {
            html += renderPlainMarkdown(text.slice(last, match.index));

            const language = (match[1] || "text").toLowerCase();
            const code = match[2].replace(/^\n/, "").replace(/\n$/, "");

            html += `
                <div class="code-block-wrap">
                    <div class="code-block-head">
                        <span>${escapeHtml(language)}</span>
                        <button class="code-copy-button" type="button" title="Copy code">
                            <span class="material-symbols-rounded">content_copy</span>
                            Copy
                        </button>
                    </div>
                    <pre><code class="language-${escapeHtml(language)}">${escapeHtml(code)}</code></pre>
                </div>
            `;

            last = fence.lastIndex;
        }

        html += renderPlainMarkdown(text.slice(last));
        return html;
    }

    function renderPlainMarkdown(text) {
        let safe = escapeHtml(text);

        safe = safe.replace(
            /`([^`]+)`/g,
            '<code class="inline-code">$1</code>'
        );

        safe = safe.replace(
            /\*\*([^*]+)\*\*/g,
            "<strong>$1</strong>"
        );

        safe = safe.replace(
            /^### (.+)$/gm,
            "<h3>$1</h3>"
        );

        safe = safe.replace(
            /^## (.+)$/gm,
            "<h2>$1</h2>"
        );

        safe = safe.replace(
            /^# (.+)$/gm,
            "<h1>$1</h1>"
        );

        safe = safe.replace(
            /\n/g,
            "<br>"
        );

        return safe;
    }

    function enhanceCodeCopyButtons(root) {
        root.querySelectorAll(".code-copy-button").forEach(button => {
            if (button.dataset.bound) return;
            button.dataset.bound = "1";

            button.addEventListener("click", async () => {
                const code = button
                    .closest(".code-block-wrap")
                    ?.querySelector("pre code")
                    ?.textContent || "";

                await copyText(code);
                flashButton(button, "check");
            });
        });
    }

    function formatAssistantContent(content) {
        if (!content || content.dataset.formatting === "1") return;

        const raw = content.dataset.rawText || content.textContent || "";
        if (!raw.trim()) return;

        content.dataset.rawText = raw;
        content.innerHTML = renderAssistantText(raw);
        enhanceCodeCopyButtons(content);
    }

    /* Wait until streaming stops, then format. */
    const formatTimers = new WeakMap();
    const observer = new MutationObserver(mutations => {
        mutations.forEach(mutation => {
            const content = mutation.target.closest?.(".assistant-content") ||
                (mutation.target.classList?.contains("assistant-content")
                    ? mutation.target : null);

            if (!content) return;

            clearTimeout(formatTimers.get(content));
            formatTimers.set(content, setTimeout(() => {
                formatAssistantContent(content);
                addAssistantActions(content.closest(".assistant-row"), content);
            }, 800));
        });
    });

    observer.observe(messagesEl, {
        childList: true,
        subtree: true,
        characterData: true
    });

    function addAssistantActions(row, content) {
        if (!row || !content || row.querySelector(".assistant-actions")) return;

        const actions = document.createElement("div");
        actions.className = "assistant-actions";

        const copy = document.createElement("button");
        copy.type = "button";
        copy.title = "Copy response";
        copy.innerHTML = '<span class="material-symbols-rounded">content_copy</span>';

        const regenerate = document.createElement("button");
        regenerate.type = "button";
        regenerate.title = "Regenerate response";
        regenerate.innerHTML = '<span class="material-symbols-rounded">refresh</span>';

        copy.addEventListener("click", async () => {
            await copyText(content.dataset.rawText || content.textContent);
            flashButton(copy, "check");
        });

        regenerate.addEventListener("click", () => {
            regenerateResponse(row);
        });

        actions.append(copy, regenerate);
        row.appendChild(actions);
    }

    async function regenerateResponse(row) {
        const previousUser = row?.previousElementSibling;
        const userBubble = previousUser?.querySelector(".user-message");
        const text = userBubble?.textContent?.trim();

        if (!text) return;

        const content = row.querySelector(".assistant-content");
        if (!content) return;

        const actions = row.querySelector(".assistant-actions");
        if (actions) actions.remove();

        content.dataset.rawText = "";
        content.innerHTML = `
            <div class="thinking">
                <span></span><span></span><span></span>
            </div>
        `;

        try {
            const response = await fetch("/api/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: selectedModelForFeature(),
                    message: text,
                    effort: selectedEffortForFeature()
                })
            });

            if (!response.ok) throw new Error(await response.text());

            let answer = "";
            const reader = response.body?.getReader();

            if (reader) {
                const decoder = new TextDecoder();
                while (true) {
                    const result = await reader.read();
                    if (result.done) break;
                    answer += decoder.decode(result.value, { stream: true });
                    content.textContent = answer;
                }
                answer += decoder.decode();
            } else {
                const data = await response.json();
                answer = data.response || data.message || data.reply || "";
                content.textContent = answer;
            }

            content.dataset.rawText = answer;
            content.innerHTML = renderAssistantText(answer);
            enhanceCodeCopyButtons(content);
            addAssistantActions(row, content);
            saveCurrentChatFromDOM();

        } catch (error) {
            content.dataset.rawText = "Unable to regenerate the response.";
            content.textContent = content.dataset.rawText;
            addAssistantActions(row, content);
        }
    }

    function selectedModelForFeature() {
        return localStorage.getItem("entity_ollama_model") ||
            modelEl?.textContent?.trim() || "qwen3:4b";
    }

    function selectedEffortForFeature() {
        return localStorage.getItem("entity_effort") ||
            effortEl?.textContent?.trim() || "Medium";
    }

    /* =====================================================
       SAVE / RESTORE HISTORY
    ===================================================== */

    function saveCurrentChatFromDOM() {
        if (!currentChat) return;

        const items = [];

        Array.from(messagesEl.children).forEach(row => {
            const user = row.querySelector(".user-message");
            const assistant = row.querySelector(".assistant-content");

            if (user) {
                items.push({
                    role: "user",
                    content: user.textContent || ""
                });
            } else if (assistant) {
                items.push({
                    role: "assistant",
                    content: assistant.dataset.rawText || assistant.textContent || ""
                });
            }
        });

        currentChat.messages = items;
        currentChat.updatedAt = Date.now();
        currentChat.model = selectedModelForFeature();
        currentChat.effort = selectedEffortForFeature();

        const firstUser = items.find(item => item.role === "user");
        if (firstUser) {
            currentChat.title = shortTitle(firstUser.content);
            if (titleEl) titleEl.textContent = currentChat.title;
        }

        history = history.filter(item => item.id !== currentChat.id);
        history.unshift(currentChat);
        saveHistory();
        renderHistoryUI();
    }

    function restoreCurrentChat() {
        if (!currentChat?.messages?.length) return;

        messagesEl.innerHTML = "";

        currentChat.messages.forEach(item => {
            if (item.role === "user") {
                const row = document.createElement("div");
                row.className = "user-row";
                const bubble = document.createElement("div");
                bubble.className = "user-message";
                bubble.textContent = item.content;
                row.appendChild(bubble);
                messagesEl.appendChild(row);
            } else {
                const row = document.createElement("div");
                row.className = "assistant-row";

                const icon = document.createElement("div");
                icon.className = "assistant-icon";
                icon.innerHTML = '<span class="material-symbols-rounded">auto_awesome</span>';

                const content = document.createElement("div");
                content.className = "assistant-content";
                content.dataset.rawText = item.content;
                content.innerHTML = renderAssistantText(item.content);

                row.append(icon, content);
                messagesEl.appendChild(row);
                addAssistantActions(row, content);
            }
        });

        enhanceCodeCopyButtons(messagesEl);
        if (titleEl) titleEl.textContent = currentChat.title;
        if (modelEl) modelEl.textContent = currentChat.model;
        if (effortEl) effortEl.textContent = currentChat.effort;
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    restoreCurrentChat();

    /* =====================================================
       WATCH NEW USER / ASSISTANT MESSAGES
    ===================================================== */

    const historyObserver = new MutationObserver(() => {
        setTimeout(() => {
            saveCurrentChatFromDOM();
        }, 900);
    });

    historyObserver.observe(messagesEl, {
        childList: true,
        subtree: true,
        characterData: true
    });

    /* =====================================================
       INITIAL URL MESSAGE
    ===================================================== */

    const params = new URLSearchParams(window.location.search);
    const firstMessage = params.get("message");
    const chatIdFromUrl = params.get("chat_id");

    if (chatIdFromUrl) {
        const found = history.find(item => item.id === chatIdFromUrl);
        if (found && found.id !== currentId) {
            localStorage.setItem(CURRENT_KEY, found.id);
            window.location.reload();
            return;
        }
    }

    /* Expose a small helper for the existing chat code. */
    window.entitySaveChat = saveCurrentChatFromDOM;

    console.log("Entity history, copy, regenerate and code formatting ready.");

})();
</script>
